<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibrador Klipper - Extrusor</title>
    <style>
        :root {
            --primary: #2196F3;
            --dark-bg: #1a1a1a;
            --light-text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--light-text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .klipper-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .klipper-logo {
            max-width: 300px;
            height: auto;
            margin: 20px 0;
            filter: drop-shadow(0 0 15px rgba(33, 150, 243, 0.5));
            transition: transform 0.3s ease;
        }

        .klipper-logo:hover {
            transform: scale(1.05);
        }

        .calculator {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            border: 1px solid #3d3d3d;
        }

        .input-group {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: #404040;
            border: 1px solid #4d4d4d;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        button {
            background: var(--primary);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #1976D2;
            transform: translateY(-2px);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #2196F311;
            border-radius: 8px;
            border: 1px solid #2196F333;
            display: none;
        }

        .error-message {
            color: #ff4444;
            margin: 10px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="klipper-header">
        <img src="https://raw.githubusercontent.com/Klipper3d/klipper/master/docs/img/klipper-logo.png" 
             alt="Klipper Logo" 
             class="klipper-logo">
        <h1>Calibrador de Extrusor</h1>
    </div>

    <div class="calculator">
        <div class="input-group">
            <label for="current_rd">Rotation Distance Actual:</label>
            <input type="number" id="current_rd" step="any" placeholder="Ej: 7.523" required>
        </div>

        <div class="input-group">
            <label for="target_length">Longitud Solicitada (mm):</label>
            <input type="number" id="target_length" value="100" step="1" required>
        </div>

        <div class="input-group">
            <label for="actual_length">Longitud Real Extruída (mm):</label>
            <input type="number" id="actual_length" step="any" placeholder="Mide con calibre" required>
        </div>

        <button onclick="calculateNewRD()">Calcular Nuevo Valor</button>
        
        <div class="error-message" id="error_msg"></div>

        <div class="result" id="result">
            <strong>Nuevo Rotation Distance:</strong> 
            <span id="new_rd">0</span>
            <div id="formula_detail" style="margin-top: 15px;"></div>
			<strong>Creado por MakerManiac3D para GrupoMaker</strong> 
        </div>
    </div>

    <script>
        function calculateNewRD() {
            const currentRD = parseFloat(document.getElementById('current_rd').value);
            const target = parseFloat(document.getElementById('target_length').value);
            const actual = parseFloat(document.getElementById('actual_length').value);

            document.getElementById('error_msg').style.display = 'none';
            document.getElementById('result').style.display = 'none';

            if (isNaN(currentRD)) {
                showError("Por favor ingresa el rotation distance actual");
                return;
            }
            
            if (isNaN(target) || target <= 0) {
                showError("La longitud solicitada debe ser mayor a 0");
                return;
            }

            if (isNaN(actual) || actual <= 0) {
                showError("La longitud real medida debe ser mayor a 0");
                return;
            }

            const newRD = (currentRD * actual) / target;
            
            document.getElementById('new_rd').textContent = newRD.toFixed(3);
            document.getElementById('formula_detail').innerHTML = 
                `Fórmula: (${currentRD} × ${actual}) / ${target} = ${newRD.toFixed(3)}`;
            document.getElementById('result').style.display = 'block';
        }

        function showError(message) {
            const errorElement = document.getElementById('error_msg');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
    </script>
</body>
</html>
